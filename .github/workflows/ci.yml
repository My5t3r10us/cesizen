name: CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: [master, main]

env:
  JWT_SECRET: ci-test-secret-key-for-testing-only-32chars-long
  ENCRYPTION_KEY: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
  DATABASE_URL: postgresql://postgres:postgres@localhost:5432/cesizen_test

jobs:
  web-quality:
    name: Web PWA · lint + type-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - name: Lint
        run: bun run lint
      - name: Type check
        run: bun run type-check

  web-build:
    name: Web PWA · build
    runs-on: ubuntu-latest
    needs: web-quality
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - name: Build Next.js
        run: bun run build

  web-unit:
    name: Web · unit tests (Vitest)
    runs-on: ubuntu-latest
    needs: web-quality
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - name: Run unit tests
        run: bun run test:unit

  web-integration:
    name: Web · integration tests (Supertest)
    runs-on: ubuntu-latest
    needs: web-quality
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: cesizen_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - name: Apply migrations
        run: bunx drizzle-kit migrate
      - name: Run integration tests
        run: bun run test:integration

  web-e2e:
    name: Web PWA · E2E (Playwright)
    runs-on: ubuntu-latest
    needs: web-build
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: cesizen_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - name: Apply migrations
        run: bunx drizzle-kit migrate
      - name: Seed database
        run: bun run db:seed
        continue-on-error: true
      - name: Install Playwright browsers
        run: bunx playwright install --with-deps chromium
      - name: Build app
        run: bun run build
      - name: Run Playwright tests
        run: bun run test:e2e -- --project=chromium
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
